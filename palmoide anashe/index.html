<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viproxxx | Home</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .carousel-container {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
            background-color: var(--color-oscuro);
        }
        .carousel-slide {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide 12s infinite ease-in-out;
        }
        .slide {
            width: 33.333%;
            height: 100%;
            position: relative;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }
        .slide-caption {
            position: absolute;
            bottom: 20%;
            left: 10%;
            color: white;
            z-index: 10;
        }
        .slide-caption h2 { font-size: 3rem; text-transform: uppercase; font-style: italic; }
        
        @keyframes slide {
            0%, 25% { transform: translateX(0); }
            33%, 58% { transform: translateX(-33.333%); }
            66%, 91% { transform: translateX(-66.666%); }
        }

        /* Grid de Productos */
        .products-section { padding: 3rem 2rem; }
        .products-section h2 { text-align: center; margin-bottom: 2rem; text-transform: uppercase; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card img { max-width: 100%; height: auto; }
        .product-price { color: var(--color-primario); font-weight: bold; font-size: 1.2rem; margin: 0.5rem 0; }
    </style>
</head>
