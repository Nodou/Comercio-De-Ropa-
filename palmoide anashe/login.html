<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viproxxx | Acceso</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-options-box {
            text-align: center;
            max-width: 500px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            border: 1px solid #ddd;
            background: var(--color-claro);
        }
        .login-options-box h2 {
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .option-block {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px dashed #ccc;
            transition: all 0.3s;
        }
        .option-block:hover {
            border-color: var(--color-primario);
        }
        .option-block p {
            font-size: 0.9rem;
            color: var(--color-texto-mutado);
            margin-bottom: 0.8rem;
        }
        .option-block .btn-primary, .option-block .btn-secondary {
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html">VIPROXXX</a></div>
    </header>

    <main class="login-options-box">
        <h2>¿Cómo deseas ingresar?</h2>

        <div class="option-block">
            <p>Comprá rápido sin registrar tus datos.</p>
            <a href="index.html"><button class="btn-secondary">Continuar como Invitado</button></a>
        </div>

        <div class="option-block">
            <p>Accedé a tu panel, historial de compras y subí tus productos.</p>
            <a href="login-usuario.html"><button class="btn-primary">Iniciar Sesión</button></a>
        </div>

        <div class="option-block">
            <p>¿Sos nuevo? Registrate para empezar a vender y comprar.</p>
            <a href="registro.html"><button class="btn-secondary" style="border-color: var(--color-primario); color: var(--color-primario);">Crear Cuenta Nueva</button></a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VIPROXXX - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
