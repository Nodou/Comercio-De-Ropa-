<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viproxxx | Crear Cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo"><a href="index.php">VIPROXXX</a></div>
    </header>

    <main class="form-container">
        <h2>Crear Cuenta</h2>
        
        <form action="procesos/procesar-registro.php" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="juan@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>

            <p style="font-size: 0.8rem; color: var(--color-texto-mutado); margin-bottom: 1rem;">
                * Al crear tu cuenta estás habilitado para vender tus propias zapatillas en nuestra plataforma.
            </p>

            <button type="submit" class="btn-primary" style="width: 100%;">Registrarme e Ingresar</button>
        </form>

        <div class="form-links">
            <p>¿Ya tenés cuenta? <a href="login-usuario.html"><b>Iniciá Sesión</b></a></p>
        </div>
    </main>

</body>
</html>
