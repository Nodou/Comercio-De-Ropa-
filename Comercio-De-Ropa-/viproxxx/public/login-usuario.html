<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPROXXX | Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

    <header>
        <div class="logo"><a href="/">
            <div class="logo-title">VI<span>PRO</span>XXX</div>
            <div class="logo-slogan">Ropa & Zapatillas</div>
        </a></div>
    </header>

    <main class="form-container">
        <h2>Ingreso Usuario</h2>
        <div id="login-mensaje" class="mensaje"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="******">
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="form-links">
            <p>¿No tenés cuenta? <a href="/registro.html"><b>Registrate acá</b></a></p>
            <p style="margin-top:0.5rem;"><a href="/login.html">Volver a opciones</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VIPROXXX - Todos los derechos reservados.</p>
    </footer>

    <script src="assets/app.js"></script>
</body>
</html>
